name: Validate static Pages app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          required = [
              'index.html',
              '.nojekyll',
              'sw-photo1.js',
              'sw.js',
              'data/financials.json',
              'data/market.json',
              'data/update-status.json',
          ]
          errors = []

          for rel in required:
              path = root / rel
              if not path.exists():
                  errors.append(f'missing required file: {rel}')
              elif rel != '.nojekyll' and path.is_file() and path.stat().st_size == 0:
                  errors.append(f'empty required file: {rel}')

          index = (root / 'index.html').read_text(encoding='utf-8')
          refs = re.findall(r'''(?:src|href)=["']([^"']+)["']''', index)
          for ref in refs:
              if ref.startswith(('http://', 'https://', 'data:', '#')):
                  continue
              clean = ref.split('?', 1)[0].split('#', 1)[0].removeprefix('./')
              if not clean:
                  continue
              path = root / clean
              if not path.exists():
                  errors.append(f'index.html references missing file: {ref}')
              elif path.is_file() and path.stat().st_size == 0:
                  errors.append(f'index.html references empty file: {ref}')

          cleanup_markers = [
              "CACHE_PREFIX = 'kpi-scope'",
              'caches.keys()',
              'caches.delete(key)',
              'self.registration.unregister()',
              "cache: 'no-store'",
          ]
          for rel in ['sw-photo1.js', 'sw.js']:
              source = (root / rel).read_text(encoding='utf-8')
              for marker in cleanup_markers:
                  if marker not in source:
                      errors.append(f'{rel} is missing cache cleanup marker: {marker}')
              if 'CACHE_NAME' in source or 'caches.match(' in source:
                  errors.append(f'{rel} still contains legacy cache-first behavior')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print(f'Validated {len(required)} required files and {len(refs)} index references.')
          PY
