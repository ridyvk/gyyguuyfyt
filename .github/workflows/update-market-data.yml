name: Update market data

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes during JPX weekday trading hours.
    - cron: "7,22,37,52 9-15 * * 1-5"
      timezone: "Asia/Tokyo"
    # Final after-close sweep.
    - cron: "7 16 * * 1-5"
      timezone: "Asia/Tokyo"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-market-data.yml"
      - ".github/update-market-data-trigger.txt"
      - "scripts/update_market_quotes.py"
      - "requirements-update.txt"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-update.txt

      - name: Refresh market quotes
        run: python scripts/update_market_quotes.py

      - name: Commit updated market data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update market data snapshot
          file_pattern: "data/market.json"
