name: Update market data

# Legacy main-branch updater. Automatic refresh and Pages deployment are handled by
# auto-refresh-pages.yml from the latest develop branch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-update.txt

      - name: Refresh market quotes
        run: python scripts/update_market_quotes.py

      - name: Commit updated market data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update market data snapshot
          file_pattern: "data/market.json"
