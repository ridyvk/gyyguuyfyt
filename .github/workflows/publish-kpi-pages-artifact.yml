name: Publish grouped KPI Pages artifact

on:
  push:
    paths:
      - .github/workflows/publish-kpi-pages-artifact.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -R assets site/
          cp -R data site/ 2>/dev/null || true
          cp manifest.webmanifest site/ 2>/dev/null || true
          cp sw*.js site/ 2>/dev/null || true
          cp icon*.* site/ 2>/dev/null || true
          touch site/.nojekyll
          test -f site/index.html
          test -f site/assets/index-BgI0090O.js
          test -f site/assets/CompanyDetail-D5tkLZhk.js
          grep -q 'index-BgI0090O.js' site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove temporary publisher
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add ../main-cleanup origin/main
          cd ../main-cleanup
          rm -f .github/workflows/publish-kpi-pages-artifact.yml
          if git diff --quiet -- .github/workflows/publish-kpi-pages-artifact.yml; then
            exit 0
          fi
          git add -u .github/workflows/publish-kpi-pages-artifact.yml
          git commit -m "Remove temporary Pages artifact publisher"
          git push origin HEAD:main
