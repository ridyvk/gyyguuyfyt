name: Auto refresh data and deploy
# source-deploy: bc7c680403a304061492a34f7b767a9d013f1771

on:
  # Re-run immediately whenever this automation itself is changed on main.
  push:
    branches: [main]
    paths:
      - .github/workflows/auto-refresh-pages.yml
  schedule:
    # Weekdays, every 15 minutes from 09:07 through 16:52 JST.
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: '7,22,37,52 0-7 * * 1-5'
    # Daily 03:40 JST for financial filings and quality audit.
    - cron: '40 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh target
        required: true
        default: market
        type: choice
        options:
          - market
          - financial
          - all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kpi-scope-auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      REQUESTED_MODE: ${{ inputs.mode || 'market' }}
    steps:
      - name: Resolve refresh mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "7,22,37,52 0-7 * * 1-5") mode="market" ;;
              "40 18 * * *") mode="financial" ;;
              *) mode="market" ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Refresh mode: $mode"

      - name: Checkout develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pandas xlrd

      - name: Update company master
        run: python scripts/update_jpx_companies.py

      - name: Refresh disclosure radar
        run: |
          python scripts/update_disclosures.py \
            --tdnet-days 3 \
            --edinet-days 3 \
            --retention-days 120

      - name: Refresh market quotes
        if: steps.mode.outputs.mode == 'market' || steps.mode.outputs.mode == 'all'
        run: python scripts/update_market_prices.py --max-companies 4500 --max-workers 8

      - name: Refresh financial filings
        if: steps.mode.outputs.mode == 'financial' || steps.mode.outputs.mode == 'all'
        run: |
          set -euo pipefail
          if [ -z "${EDINET_API_KEY:-}" ]; then
            echo "EDINET_API_KEY secret is required for financial refresh." >&2
            exit 1
          fi
          python scripts/update_edinet_financials_batched.py --scan-days 460 --max-documents 350
          python scripts/update_tdnet_financials_strict.py --lookback-days 45 --max-documents 700
          python scripts/finalize_annual_dataset.py
          python scripts/split_financials.py
          python scripts/audit_golden_companies.py --check
          python scripts/audit_all_companies.py --check

      - name: Validate datasets
        run: |
          set -euo pipefail
          python scripts/validate_datasets.py --scope disclosure
          if [ "${{ steps.mode.outputs.mode }}" = "market" ]; then
            python scripts/validate_datasets.py --scope market
          else
            python scripts/validate_datasets.py --scope all
          fi

      - name: Commit refreshed data
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kpi-scope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/listedCompanies.json src/lib/companySource.ts public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: auto refresh ${{ steps.mode.outputs.mode }}"
            git pull --rebase origin develop
            git push origin HEAD:develop
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install --no-audit --no-fund

      - name: Build
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4