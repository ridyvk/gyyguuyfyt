name: Update JPX company master

on:
  workflow_dispatch:

permissions:
  contents: write

# Published static branch remains ref: main.
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop source
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade -r requirements-update.txt

      - name: Update JPX company master
        run: python scripts/update_jpx_companies.py

      - name: Reconcile generated datasets
        run: |
          python scripts/finalize_annual_dataset.py
          python scripts/split_financials.py
          python scripts/update_disclosures.py --bootstrap-only --retention-days 120
          python scripts/update_market_prices.py --max-companies 4500 --max-workers 8

      - name: Validate reconciled datasets
        run: python scripts/validate_datasets.py --scope all

      - name: Commit updated company master
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: develop
          commit_message: "data: update JPX company master"
          file_pattern: src/data/listedCompanies.json src/lib/companySource.ts public/data
