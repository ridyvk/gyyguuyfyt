name: Deploy KPI groups

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-kpi-groups.yml"

permissions:
  contents: write

concurrency:
  group: deploy-kpi-groups
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch payload
        uses: actions/checkout@v4
        with:
          ref: main
          path: payload

      - name: Restore KPI source patch
        shell: bash
        run: |
          tr -d '[:space:]' < payload/.github/kpi-groups-n0.patch.gz.b64 | base64 -d | gunzip > /tmp/kpi-groups.patch

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply and save source patch
        shell: bash
        run: |
          cd source
          if git apply --check --unidiff-zero /tmp/kpi-groups.patch; then
            git apply --unidiff-zero /tmp/kpi-groups.patch
            git add index.html \
              manifest.webmanifest \
              public/manifest.webmanifest \
              public/sw-photo1.js \
              src/components/CompanyCard.tsx \
              src/lib/analysis.ts \
              src/lib/companyUniverse.ts \
              src/lib/detailInsights.ts \
              src/lib/formatters.ts \
              src/lib/industryKpiPolicy.ts \
              src/lib/liveData.ts \
              src/lib/metricConfidence.ts \
              src/lib/scoring.ts \
              src/motion.css \
              src/pages/CompanyDetail.tsx \
              src/pages/Compare.tsx \
              src/styles.css \
              src/types.ts
            if ! git diff --cached --quiet; then
              git commit -m "Add grouped KPI metrics"
              git push origin HEAD:develop
            fi
          else
            echo "Patch did not apply cleanly; checking whether source already contains KPI groups."
          fi
          grep -q "evEbitda" src/pages/CompanyDetail.tsx
          grep -q "kpi-category-grid" src/styles.css

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Build source
        shell: bash
        run: |
          cd source
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Copy build into Pages branch
        shell: bash
        run: |
          cp -R source/dist/. site/
          if [ -f site/assets/icon-180-scope-v2.png ]; then
            cp site/assets/icon-180-scope-v2.png site/icon-180-scope-v2.png
          fi
          cd site
          git rm -f --ignore-unmatch .github/workflows/deploy-kpi-groups.yml .github/kpi-groups-n0.patch.gz.b64
          git add index.html manifest.webmanifest sw-photo1.js sw.js
          if [ -f icon-180-scope-v2.png ]; then git add icon-180-scope-v2.png; fi
          git add assets/*.js assets/*.css assets/*.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m "Deploy grouped KPI metrics"
            git push origin HEAD:main
          else
            echo "No site changes to deploy."
          fi
